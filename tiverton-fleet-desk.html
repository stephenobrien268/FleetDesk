<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiverton Fleet Desk</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172b2a;
      --muted: #71817f;
      --line: #e5ebe8;
      --canvas: #f5f7f5;
      --white: #fff;
      --green: #147d62;
      --green-dark: #105f4c;
      --green-pale: #e8f4ef;
      --amber: #a56814;
      --amber-pale: #fbf1dd;
      --red: #b4443d;
      --red-pale: #f9e9e7;
      --blue: #426c9a;
      --blue-pale: #eaf0f7;
      --shadow: 0 10px 30px rgba(22, 51, 42, .08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 14px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 248px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column;
      padding: 24px 16px 18px; background: #102f2b; color: #dce9e5;
    }
    .brand { display: flex; align-items: center; gap: 12px; padding: 0 8px 28px; }
    .brand-mark {
      display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px;
      background: #d5eee3; color: #125b47; font-weight: 850; letter-spacing: -.06em;
    }
    .brand strong { display: block; color: #fff; font-size: 14px; letter-spacing: -.02em; }
    .brand span { display: block; color: #a3beb5; margin-top: 2px; font-size: 11px; }
    .nav-label { padding: 10px 10px 8px; color: #88a89e; font-size: 10px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .nav { display: grid; gap: 4px; }
    .nav button {
      display: flex; align-items: center; gap: 12px; width: 100%; padding: 10px 12px;
      color: #c1d4cd; background: transparent; border: 0; border-radius: 9px; text-align: left;
      transition: background .15s, color .15s;
    }
    .nav button:hover { background: #1c403a; color: #fff; }
    .nav button.active { color: #fff; background: #245549; box-shadow: inset 3px 0 #9ad8bb; }
    .nav-icon { width: 20px; text-align: center; font-size: 16px; opacity: .9; }
    .nav-count { margin-left: auto; min-width: 20px; padding: 1px 6px; border-radius: 99px; background: #ad503e; color: white; font-size: 11px; text-align: center; }
    .sidebar-bottom { margin-top: auto; }
    .depot-card { padding: 13px; border: 1px solid #33564e; border-radius: 12px; background: #173a34; }
    .depot-card .eyebrow { color: #9ab7ad; font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .depot-card strong { display: block; margin-top: 5px; color: white; font-size: 13px; }
    .depot-card span { display: block; margin-top: 2px; color: #b0c7bf; font-size: 11px; }
    .demo-note { margin: 12px 4px 0; color: #93aaa2; font-size: 10px; line-height: 1.5; }
    .main { min-width: 0; }
    .topbar {
      position: sticky; z-index: 5; top: 0; display: flex; justify-content: space-between; align-items: center;
      min-height: 72px; padding: 0 34px; background: rgba(255,255,255,.92); border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }
    .crumb { color: var(--muted); font-size: 12px; }
    .crumb strong { color: var(--ink); font-weight: 700; }
    .top-actions { display: flex; align-items: center; gap: 12px; }
    .search-wrap { position: relative; width: min(340px, 36vw); }
    .search-wrap input {
      width: 100%; padding: 10px 38px 10px 36px; border: 1px solid var(--line); border-radius: 9px;
      outline: none; color: var(--ink); background: #fbfcfb;
    }
    .search-wrap input:focus { border-color: #8db9a7; box-shadow: 0 0 0 3px #dcede5; }
    .search-icon { position: absolute; left: 12px; top: 9px; color: #8a9996; }
    .search-key { position: absolute; right: 9px; top: 9px; color: #8a9996; font-size: 10px; }
    .search-results {
      display: none; position: absolute; top: 46px; left: 0; right: 0; max-height: 360px; overflow: auto;
      padding: 6px; background: white; border: 1px solid var(--line); border-radius: 11px; box-shadow: var(--shadow);
    }
    .search-results.open { display: block; }
    .search-result { display: block; width: 100%; padding: 9px 10px; border: 0; border-radius: 7px; background: white; text-align: left; }
    .search-result:hover { background: var(--canvas); }
    .search-result strong, .search-result span { display: block; }
    .search-result span { margin-top: 2px; color: var(--muted); font-size: 11px; }
    .avatar { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: #27644f; background: #e1f0e9; font-weight: 750; }
    .content { max-width: 1440px; margin: 0 auto; padding: 30px 34px 44px; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; margin-bottom: 23px; }
    .page-head h1 { margin: 0; font-size: clamp(24px, 3vw, 30px); letter-spacing: -.045em; line-height: 1.15; }
    .page-head p { margin: 7px 0 0; color: var(--muted); }
    .head-actions { display: flex; gap: 9px; align-items: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 13px;
      border: 1px solid var(--line); border-radius: 8px; background: white; color: var(--ink); font-weight: 650;
      transition: transform .12s, background .12s, border .12s;
    }
    .btn:hover { background: #f8faf8; border-color: #cbd8d2; }
    .btn:active { transform: translateY(1px); }
    .btn.primary { color: white; background: var(--green); border-color: var(--green); }
    .btn.primary:hover { background: var(--green-dark); }
    .btn.ghost-danger { color: var(--red); border-color: #efd6d3; }
    .btn.small { padding: 6px 9px; font-size: 12px; }
    .grid { display: grid; gap: 16px; }
    .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 18px; }
    .card { background: white; border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 2px 6px rgba(22,51,42,.025); }
    .stat-card { padding: 17px 18px; }
    .stat-top { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 12px; font-weight: 650; }
    .stat-icon { display: grid; place-items: center; width: 31px; height: 31px; border-radius: 9px; background: var(--green-pale); color: var(--green); font-size: 15px; }
    .stat-card.warning .stat-icon { background: var(--amber-pale); color: var(--amber); }
    .stat-card.danger .stat-icon { background: var(--red-pale); color: var(--red); }
    .stat-value { display: flex; align-items: baseline; gap: 8px; margin-top: 9px; font-size: 29px; font-weight: 780; letter-spacing: -.04em; }
    .stat-meta { color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0; }
    .dash-grid { grid-template-columns: minmax(0, 1.45fr) minmax(310px, .9fr); }
    .panel { padding: 19px; }
    .panel-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 17px; }
    .panel-head h2 { margin: 0; font-size: 15px; letter-spacing: -.02em; }
    .panel-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .link-btn { border: 0; padding: 4px 0; background: transparent; color: var(--green); font-size: 12px; font-weight: 700; }
    .link-btn:hover { color: var(--green-dark); text-decoration: underline; }
    .chart { height: 210px; display: flex; align-items: end; justify-content: space-around; gap: 12px; padding: 8px 4px 0; border-bottom: 1px solid var(--line); }
    .chart-col { display: flex; flex: 1; height: 100%; flex-direction: column; justify-content: end; align-items: center; gap: 8px; }
    .chart-bar { position: relative; width: min(38px, 72%); min-height: 14px; border-radius: 6px 6px 2px 2px; background: #c7e4d6; }
    .chart-bar.current { background: var(--green); }
    .chart-bar:hover::after { content: attr(data-value); position: absolute; top: -27px; left: 50%; transform: translateX(-50%); padding: 3px 6px; border-radius: 5px; color: white; background: #1d3731; font-size: 10px; white-space: nowrap; }
    .chart-label { padding-bottom: 8px; color: var(--muted); font-size: 10px; }
    .chart-legend { display: flex; justify-content: space-between; margin-top: 12px; color: var(--muted); font-size: 11px; }
    .legend-dot { display: inline-block; width: 8px; height: 8px; margin-right: 6px; border-radius: 50%; background: var(--green); }
    .alert-list { display: grid; gap: 0; }
    .alert-item { display: grid; grid-template-columns: 35px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid #eff2f0; }
    .alert-item:first-child { border-top: 0; padding-top: 0; }
    .alert-icon { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--amber-pale); color: var(--amber); }
    .alert-icon.red { color: var(--red); background: var(--red-pale); }
    .alert-copy strong { display: block; font-size: 12px; }
    .alert-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .alert-date { color: var(--muted); font-size: 10px; white-space: nowrap; }
    .lower-grid { grid-template-columns: minmax(0, 1.15fr) minmax(290px, .85fr); margin-top: 16px; }
    .mini-table { width: 100%; border-collapse: collapse; }
    .mini-table th { padding: 0 8px 10px; color: #869491; font-size: 10px; font-weight: 750; text-align: left; text-transform: uppercase; letter-spacing: .07em; }
    .mini-table td { padding: 11px 8px; border-top: 1px solid #eff2f0; font-size: 12px; }
    .mini-table td:first-child { padding-left: 0; }
    .mini-table th:first-child { padding-left: 0; }
    .reg { font-weight: 800; letter-spacing: .04em; }
    .subline { display: block; color: var(--muted); font-size: 10px; font-weight: 450; letter-spacing: 0; }
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 999px; font-size: 10px; font-weight: 750; white-space: nowrap; }
    .badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
    .badge.good { color: #267252; background: #e9f5ed; }
    .badge.warn { color: #986414; background: #fbf1dd; }
    .badge.bad { color: #a73e38; background: #f9e9e7; }
    .badge.info { color: #466b93; background: #eaf0f7; }
    .activity-list { display: grid; }
    .activity { display: grid; grid-template-columns: 28px 1fr; gap: 10px; padding: 11px 0; border-top: 1px solid #eff2f0; }
    .activity:first-child { padding-top: 0; border-top: 0; }
    .activity-mark { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; background: #f0f5f2; color: var(--green); font-size: 12px; }
    .activity p { margin: 0; font-size: 11px; line-height: 1.5; }
    .activity time { display: block; margin-top: 3px; color: var(--muted); font-size: 10px; }
    .table-card { overflow: hidden; }
    .table-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 15px 17px; border-bottom: 1px solid var(--line); }
    .table-toolbar p { margin: 0; color: var(--muted); font-size: 12px; }
    .filter-input { width: 210px; max-width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 7px; outline: none; }
    .filter-input:focus, .form-control:focus { border-color: #8db9a7; box-shadow: 0 0 0 3px #dcede5; }
    .table-scroll { overflow-x: auto; }
    .data-table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    .data-table th { padding: 11px 16px; color: #879390; background: #fbfcfb; font-size: 10px; font-weight: 750; text-align: left; text-transform: uppercase; letter-spacing: .07em; }
    .data-table td { padding: 13px 16px; border-top: 1px solid #eff2f0; font-size: 12px; }
    .data-table tbody tr:hover { background: #fbfdfb; }
    .row-link { color: var(--green); border: 0; background: none; font-weight: 700; }
    .row-link:hover { text-decoration: underline; }
    .section-tabs { display: flex; gap: 18px; margin: -4px 0 16px; border-bottom: 1px solid var(--line); }
    .section-tabs button { padding: 8px 2px 10px; border: 0; border-bottom: 2px solid transparent; color: var(--muted); background: transparent; font-size: 12px; font-weight: 650; }
    .section-tabs button.active { border-color: var(--green); color: var(--green); }
    .empty-state { padding: 32px 16px; color: var(--muted); text-align: center; }
    .notice { display: flex; gap: 10px; padding: 12px 14px; margin-bottom: 14px; border: 1px solid #e4ece7; border-radius: 9px; background: #f5faf7; color: #527166; font-size: 11px; }
    .notice strong { color: #295844; }
    .modal-backdrop { position: fixed; z-index: 20; inset: 0; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(12,31,27,.44); }
    .modal-backdrop.open { display: flex; }
    .modal { width: min(600px, 100%); max-height: min(90vh, 850px); overflow: auto; border-radius: 14px; background: white; box-shadow: 0 24px 90px rgba(10,30,24,.24); }
    .modal-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; padding: 20px 22px 15px; border-bottom: 1px solid var(--line); }
    .modal-head h2 { margin: 0; font-size: 18px; letter-spacing: -.03em; }
    .modal-head p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .icon-btn { display: grid; place-items: center; width: 30px; height: 30px; border: 0; border-radius: 7px; color: #64736f; background: #f3f6f4; font-size: 18px; }
    .modal-body { padding: 18px 22px 22px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--line); }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 13px 14px; }
    .field { display: grid; gap: 5px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #52615d; font-size: 11px; font-weight: 700; }
    .form-control { width: 100%; padding: 9px 10px; border: 1px solid #dfe6e2; border-radius: 7px; outline: none; color: var(--ink); background: white; }
    textarea.form-control { min-height: 75px; resize: vertical; }
    .form-help { color: var(--muted); font-size: 10px; }
    .report-section { padding: 13px 0; border-bottom: 1px solid #eff2f0; }
    .report-section:last-child { border-bottom: 0; }
    .report-section h3 { margin: 0 0 8px; color: #798783; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .report-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 16px; }
    .report-meta span { display: block; color: var(--muted); font-size: 10px; }
    .report-meta strong { display: block; margin-top: 2px; font-size: 12px; }
    .report-note { margin: 0; font-size: 12px; line-height: 1.6; }
    .roller-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: #fbfcfb; }
    .toast-area { position: fixed; z-index: 40; right: 22px; bottom: 22px; display: grid; gap: 8px; }
    .toast { padding: 11px 15px; border-radius: 9px; color: white; background: #193d33; box-shadow: var(--shadow); animation: toast-in .2s ease-out; }
    .calendar-wrap { overflow: auto; max-height: 72vh; }
    .calendar-table { border-collapse: separate; border-spacing: 0; white-space: nowrap; }
    .calendar-table th, .calendar-table td { min-width: 43px; padding: 7px 5px; border-right: 1px solid #eff2f0; border-bottom: 1px solid #eff2f0; text-align: center; font-size: 10px; }
    .calendar-table th { position: sticky; z-index: 2; top: 0; background: #fbfcfb; color: #75827f; }
    .calendar-table th:first-child, .calendar-table td:first-child { position: sticky; z-index: 3; left: 0; min-width: 110px; background: white; text-align: left; }
    .calendar-table th:first-child { z-index: 4; background: #fbfcfb; }
    .calendar-table .current-week { background: #e8f4ef; color: var(--green); }
    .cal-code { display: inline-block; min-width: 27px; padding: 3px 4px; border-radius: 4px; font-weight: 800; }
    .cal-code.stage-1 { color: #121b19; text-decoration: line-through; }
    .cal-code.stage-2 { color: #356caa; text-decoration: line-through; }
    .cal-code.stage-3 { color: #27654e; background: #fff1bd; text-decoration: line-through; }
    .cal-code.stage-4 { color: white; background: #b4443d; }
    .cal-code.vor { color: #9c4038; background: #fae8e5; }
    .field-hint { color: var(--muted); font-size: 10px; }
    .inline-actions { display: flex; flex-wrap: wrap; gap: 7px; }
    .rag-row { display: flex; align-items: center; gap: 8px; }
    .days-pill { display: inline-block; padding: 3px 7px; border-radius: 99px; background: var(--amber-pale); color: var(--amber); font-size: 10px; font-weight: 750; }
    .days-pill.overdue { background: var(--red-pale); color: var(--red); }
    .days-pill.ok { background: var(--green-pale); color: var(--green); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 1050px) {
      .app { grid-template-columns: 205px minmax(0, 1fr); }
      .content { padding-right: 22px; padding-left: 22px; }
      .topbar { padding-right: 22px; padding-left: 22px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .dash-grid, .lower-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 700px) {
      .app { display: block; }
      .sidebar { position: relative; width: 100%; height: auto; padding: 12px 14px; }
      .brand { padding: 0 4px 12px; }
      .sidebar .nav-label, .sidebar-bottom { display: none; }
      .nav { display: flex; overflow-x: auto; gap: 5px; }
      .nav button { flex: 0 0 auto; width: auto; padding: 8px 10px; font-size: 11px; }
      .nav-icon { display: none; }
      .nav-count { margin-left: 0; }
      .topbar { position: relative; min-height: 58px; padding: 0 15px; }
      .content { padding: 22px 15px 34px; }
      .search-wrap { width: min(240px, 56vw); }
      .crumb { display: none; }
      .page-head { flex-direction: column; }
      .head-actions { width: 100%; }
      .head-actions .btn { flex: 1; }
      .stats { gap: 10px; }
      .stat-card { padding: 13px; }
      .stat-value { font-size: 24px; }
      .panel { padding: 15px; }
      .form-grid, .report-meta { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .table-toolbar { align-items: flex-start; flex-direction: column; }
      .filter-input { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">TF</div>
        <div><strong>Tiverton Fleet Desk</strong><span>Depot operations</span></div>
      </div>
      <div class="nav-label">Workspace</div>
      <nav class="nav" aria-label="Main navigation">
        <button class="active" data-view="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
        <button data-view="vehicles"><span class="nav-icon">▰</span>Vehicles</button>
        <button data-view="calendar"><span class="nav-icon">▦</span>Maintenance calendar</button>
        <button data-view="checks"><span class="nav-icon">✓</span>Completed checks</button>
        <button data-view="drivers"><span class="nav-icon">♙</span>Drivers</button>
        <button data-view="starters"><span class="nav-icon">＋</span>New starters</button>
        <button data-view="cpc"><span class="nav-icon">◷</span>CPC hours</button>
        <button data-view="tacho"><span class="nav-icon">◷</span>Tacho &amp; pay</button>
        <button data-view="defects"><span class="nav-icon">!</span>Driver defects</button>
        <button data-view="compliance"><span class="nav-icon">◷</span>PMI &amp; compliance<span class="nav-count" id="compliance-count">2</span></button>
        <button data-view="quality"><span class="nav-icon">✓</span>Quality checks</button>
        <button data-view="settings"><span class="nav-icon">⚙</span>Configuration</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="depot-card"><div class="eyebrow">Active depot</div><strong>Tiverton</strong><span>Carlsberg Britvic · South West</span></div>
        <div class="demo-note">Prototype preview · sample records only<br>Changes stay in this browser.</div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumb">Operations <span aria-hidden="true">/</span> <strong id="crumb-current">Dashboard</strong></div>
        <div class="top-actions">
          <div class="search-wrap">
            <span class="search-icon" aria-hidden="true">⌕</span>
            <input id="global-search" type="search" placeholder="Search reg, driver, issue..." aria-label="Search fleet, drivers and compliance">
            <span class="search-key">⌘ K</span>
            <div class="search-results" id="search-results"></div>
          </div>
          <div class="avatar" title="Depot manager">SM</div>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>
  </div>
  <div class="modal-backdrop" id="modal-backdrop" role="presentation">
    <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"></section>
  </div>
  <div class="toast-area" id="toast-area" aria-live="polite"></div>
  <script>
    const seed = {

    function parseCsv(text) {
      const rows=[];let row=[],cell="",quoted=false;
      for(let i=0;i<text.length;i++){const char=text[i];if(char==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}else if(char===","&&!quoted){row.push(cell);cell="";}else if((char==="\n"||char==="\r")&&!quoted){if(char==="\r"&&text[i+1]==="\n")i++;row.push(cell);if(row.some(value=>value.trim()))rows.push(row);row=[];cell="";}else cell+=char;}
      if(cell.length||row.length){row.push(cell);if(row.some(value=>value.trim()))rows.push(row);}
      return rows;
    }
    function normHeader(value) { return String(value||"").toLowerCase().replace(/[^a-z0-9]/g,""); }
    function parseD28Date(value) {
      const raw=String(value||"").trim();
      const match=raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if(match)return `${match[3]}-${String(match[2]).padStart(2,"0")}-${String(match[1]).padStart(2,"0")}`;
      return toIso(raw);
    }
    function parseD28Time(value) {
      const match=String(value||"").match(/(?:^|\s)(\d{1,2}):(\d{2})(?::\d{2})?/);
      return match?`${String(match[1]).padStart(2,"0")}:${match[2]}`:"";
    }
    function parseDuration(value) {
      const text=String(value||"").trim();
      const match=text.match(/^(\d{1,3}):(\d{2})$/);
      return match?Number(match[1])*60+Number(match[2]):0;
    }
    function minutesText(minutes) { return `${String(Math.floor(minutes/60)).padStart(2,"0")}:${String(minutes%60).padStart(2,"0")}`; }
    function matchDriver(name,number) {
      const byId=data.drivers.find(driver=>number&&driver.id.toLowerCase()===number.toLowerCase());
      if(byId)return byId;
      const clean=String(name||"").replace(/\s*[*#].*$/,"").replace(/\s+\d{2,}\s*$/,"").trim().toLowerCase();
      return data.drivers.find(driver=>driver.name.toLowerCase()===clean)||data.drivers.find(driver=>driver.name.toLowerCase().split(/\s+/).at(-1)===clean.split(/\s+/).at(-1)&&clean.length>3);
    }
    function importD28File(file) {
      const reader=new FileReader();
      reader.onerror=()=>toast("Could not read the selected D28 CSV file.");
      reader.onload=()=>{
        try{
          const records=parseCsv(String(reader.result||""));if(records.length<2){toast("The CSV has no data rows.");return;}
          const header=records[0].map(normHeader),column=label=>header.indexOf(normHeader(label));
          const required=["Driver's Name","Driver Number","Date","Registration","Start Of Duty","End Of Duty","Rest"];
          const missing=required.filter(label=>column(label)<0);
          if(missing.length){toast(`D28 CSV is missing required columns: ${missing.join(", ")}.`);return;}
          let added=0,skipped=0,unlinked=0;
          for(const cells of records.slice(1)){
            const get=label=>cells[column(label)]||"";
            const rawReg=get("Registration").trim();
            if(!rawReg||/^rest$/i.test(rawReg)){skipped++;continue;}
            const iso=parseD28Date(get("Date"));if(!iso){skipped++;continue;}
            const driver=matchDriver(get("Driver's Name"),get("Driver Number"));
            const start=parseD28Time(get("Start Of Duty")),end=parseD28Time(get("End Of Duty"));
            const rest=parseDuration(get("Rest"));
            const startM=start?parseDuration(start):0,endM=end?parseDuration(end):0;
            const duration=start&&end?(endM-startM+1440)%1440:0,check=0;
            const working=Math.max(0,duration-rest-check);
            const registration=rawReg.replace(/\s+/g," ").toUpperCase();
            const statusText=registration.toLowerCase();
            let category="";
            if(/holiday|annual leave/.test(statusText))category="Holiday";
            else if(/sick/.test(statusText))category="Sick";
            else if(/compassionate leave/.test(statusText))category="Paid Leave";
            const duplicate=data.tacho.some(item=>item.driverId===(driver?.id||get("Driver Number"))&&item.date===formattedDate(iso));
            if(duplicate){skipped++;continue;}
            const id=`TD-${Math.max(0,...data.tacho.map(item=>Number(item.id.split("-")[1])||0))+1}`;
            const flag=driver?"":"Driver card not linked";
            data.tacho.unshift({id,driver:driver?.name||`?${String(get("Driver's Name")).trim()}`,driverId:driver?.id||get("Driver Number"),date:formattedDate(iso),reg:category?"":normalizeReg(registration),start,end,rest:minutesText(rest),check:minutesText(check),working:category?"":minutesText(working),source:"D28",flag:category?category:flag,approval:"Pending",download:formattedDate(toIso(DEMO_TODAY)),category});
            added++;if(!driver)unlinked++;
          }
          saveData();render();toast(`Imported ${added} D28 row(s); skipped ${skipped}${unlinked?`; ${unlinked} need driver linking`:""}.`);
        }catch(error){console.error("D28 CSV import failed.",error);toast("The D28 CSV could not be processed. Check the file format.");}
      };
      reader.readAsText(file);
    }

    function saveQc() {
      if (!document.getElementById("qc-form").reportValidity()) return;
      const answers=[...modal.querySelectorAll(".qc-answer")];
      if(answers.some(input=>!input.value)){toast("Answer each required Fleet Compliance question before saving.");answers.find(input=>!input.value)?.focus();return;}
      const values={service:Number(document.getElementById("qc-service").value||0),secondary:Number(document.getElementById("qc-secondary").value||0),parking:Number(document.getElementById("qc-parking").value||0),condition:document.getElementById("qc-condition").value,dtp:document.getElementById("qc-dtp").value.trim(),bind:document.getElementById("qc-bind").value,printout:document.getElementById("qc-printout").value};
      const vehicle=data.vehicles.find(item=>item.reg===document.getElementById("qc-reg").value);
      let failed=values.bind==="Yes"||values.service<Number(data.config.rbtService||50)||values.secondary<Number(data.config.rbtSecondary||25)||values.parking<Number(data.config.rbtParking||16);
      let investigate=values.condition!=="Laden"||values.printout==="No"||(!values.dtp)||(!vehicle.dtp)||values.dtp.toLowerCase()!==String(vehicle.dtp||"").toLowerCase()||values.service===0||values.secondary===0||values.parking===0;
      const axles=[];
      for(let i=1;i<=4;i++){
        const design=Number(document.getElementById(`qc-design-${i}`).value||0),load=Number(document.getElementById(`qc-load-${i}`).value||0),left=Number(document.getElementById(`qc-left-${i}`).value||0),right=Number(document.getElementById(`qc-right-${i}`).value||0),lock=document.getElementById(`qc-lock-${i}`).value;
        if(design||load||left||right){
          const loadPct=design?load/design*100:null,imbalance=Math.max(left,right)?Math.abs(left-right)/Math.max(left,right)*100:null,effortPct=load?Math.min(left,right)/load*100:null;
          if(design&&loadPct<Number(data.config.rbtTestValid||50)||imbalance!==null&&imbalance>Number(data.config.rbtImbalanceFail||30)||effortPct!==null&&effortPct<Number(data.config.rbtWheelEffort||5))failed=true;
          if(design&&(loadPct<Number(data.config.rbtAxleGood||65)||loadPct>105)||imbalance!==null&&imbalance>Number(data.config.rbtImbalanceReview||25)||!design||lock!=="None")investigate=true;
          axles.push({axle:i,designWeight:design||null,testWeight:load||null,leftForce:left||null,rightForce:right||null,lock,loadPercent:loadPct,imbalancePercent:imbalance,minEffortPercent:effortPct});
        }
      }
      const roller=failed?"Fail":investigate?"Retest":"Pass";
      const id = `QC-${String(Math.max(0,...data.qc.map(item=>Number(item.id.split("-")[1])||0))+1).padStart(4,"0")}`;
      const date = formattedDate(document.getElementById("qc-date").value);
      const review=document.getElementById("qc-result").value;
      let result=review==="Fail"||roller==="Fail"?"Action required":review==="Part pass"||roller==="Retest"?"Follow-up":"Passed";
      const note=document.getElementById("qc-note").value.trim()||`RBT ${values.condition}; service ${values.service||"not recorded"}%, secondary ${values.secondary||"not recorded"}%, parking ${values.parking||"not recorded"}%. ${axles.length} axle(s) entered.`;
      const qcRecord={id,reg:vehicle.reg,date,inspector:document.getElementById("qc-inspector").value.trim(),result,roller,note,condition:values.condition,dtp:values.dtp,serviceEfficiency:values.service,secondaryEfficiency:values.secondary,parkingEfficiency:values.parking,bind:values.bind,printout:values.printout,axles,part1:Object.fromEntries(answers.map(input=>[input.dataset.question,input.value])),part2:{tyres:document.getElementById("qc-review-tyres").value,body:document.getElementById("qc-review-body").value,recall:document.getElementById("qc-recall").value}};
      data.qc.unshift(qcRecord);
      const linked=data.checks.find(item=>item.reg===vehicle.reg&&item.type==="PMI"&&item.date===date);
      if(linked){linked.filed=formattedDate(toIso(DEMO_TODAY));linked.qcResult=result==="Passed"?"Pass":result==="Action required"?"Fail":"Part pass";}
      saveData(); closeModal(); render(); toast(`${id} saved.`);

        issue.response = document.getElementById("response").value.trim();
        issue.responseDate = formattedDate(document.getElementById("contact-date").value);
        issue.status = "In progress";
        saveData(); closeModal(); render(); toast("Maintainer response recorded.");
      }
      if (event.target.closest("[data-save-closeout]")) {
        const id = event.target.closest("[data-save-closeout]").dataset.saveCloseout;
        const form = document.getElementById("closeout-form");
        if (!form.reportValidity()) return;
        const issue = data.issues.find(item=>item.id===id);
        issue.closeHow = document.getElementById("close-how").value.trim();
        issue.evidence = document.getElementById("close-evidence").value.trim();
        issue.closeDate = formattedDate(document.getElementById("close-date").value);
        issue.status = "Closed";
        saveData(); closeModal(); render(); toast("Close-out recorded and issue closed.");
      }
      if (event.target.closest("[data-save-issue]")) saveIssue();
      if (event.target.closest("[data-save-qc]")) saveQc();
      if (event.target.closest("[data-save-doc]")) {
        const id=event.target.closest("[data-save-doc]").dataset.saveDoc;
        const form=document.getElementById("doc-form");if(!form.reportValidity())return;
        const row=data.checks.find(item=>item.id===id);
        row.documentReceived=formattedDate(document.getElementById("doc-date").value);
        row.filed=formattedDate(document.getElementById("filed-date").value);
        row.qcResult=document.getElementById("doc-result").value==="Not reviewed"?"":document.getElementById("doc-result").value;
        saveData();closeModal();render();toast("Check document status updated.");
      }
      if (event.target.closest("[data-save-check]")) {
        const form=document.getElementById("check-form");if(!form.reportValidity())return;
        const reg=document.getElementById("check-reg").value,type=document.getElementById("check-type").value,date=document.getElementById("check-date").value;
        const vehicle=data.vehicles.find(item=>item.reg===reg);
        const wheels=document.getElementById("wheels-removed").value;
        const mileage=document.getElementById("check-mileage").value;
        if(type==="PMI"&&wheels==="Yes"&&(!mileage||!document.getElementById("retorque-time").value||!document.getElementById("retorque-by").value.trim())){toast("For wheels removed, odometer, retorque time and verifier are all required.");return;}
        if(mileage&&(!Number.isFinite(Number(mileage))||Number(mileage)<0)){toast("Odometer must be a valid non-negative number.");return;}
        const nextDue=checkDueForType(vehicle,type,date);
        const id=`CHK-${Math.max(0,...data.checks.map(item=>Number(item.id.split("-")[1])||0))+1}`;
        const result=document.getElementById("check-qc").value;
        const row={id,reg,type,date:formattedDate(date),nextDue,loggedBy:"Stephen",notes:document.getElementById("check-notes").value.trim(),documentReceived:formattedDate(document.getElementById("doc-received").value),filed:"",qcResult:result==="Not reviewed"?"":result,mileage:mileage?Number(mileage):null,wheelsRemoved:type==="PMI"?wheels:"",retorqueTime:type==="PMI"&&wheels==="Yes"?document.getElementById("retorque-time").value:"",retorqueBy:type==="PMI"&&wheels==="Yes"?document.getElementById("retorque-by").value.trim():"",dtp:type==="PMI"?document.getElementById("check-dtp").value.trim():"",dtpReason:type==="PMI"?document.getElementById("check-dtp-reason").value.trim():""};
        data.checks.unshift(row);
        if(type==="PMI"){
          vehicle.pmiLast=row.date;vehicle.nextPmi=nextDue;if(mileage)vehicle.mileage=Number(mileage).toLocaleString("en-GB");
          const lines=document.getElementById("check-compliance").value.split(/\r?\n/).map(line=>line.trim()).filter(Boolean);
          if(!row.dtp&&!row.dtpReason)lines.push("No DTP number, or signed reason why not used, recorded at PMI.");
          if(row.dtp&&vehicle.dtp&&normalizeDtp(row.dtp)!==normalizeDtp(vehicle.dtp))lines.push(`DTP recorded at PMI (${row.dtp}) does not match registered DTP (${vehicle.dtp}).`);
          if(row.dtp&&!vehicle.dtp){
            const duplicate=data.vehicles.find(item=>item.reg!==reg&&normalizeDtp(item.dtp)===normalizeDtp(row.dtp));
            if(duplicate)lines.push(`DTP number ${row.dtp} is already registered to ${displayReg(duplicate.reg)}.`);
            else if(confirm(`Register DTP ${row.dtp} to ${displayReg(reg)}?`))vehicle.dtp=row.dtp;
            else lines.push(`DTP ${row.dtp} was entered at PMI but is not registered to this vehicle.`);
          }
          lines.forEach((line,index)=>{const newId=`PMI-${Math.max(0,...data.issues.map(item=>Number(item.id.split("-")[1])||0))+1}`;data.issues.unshift({id:newId,reg,date:row.date,category:"PMI review",issue:line,maintainer:vehicle.provider||"Not assigned",status:"Awaiting response",response:"",closeHow:"",evidence:"",closeDate:"",sourceCheck:id,line:index+1});});
        }
        else if(type==="MOT Passed")vehicle.motDue=nextDue;
        else if(type==="MOT Booked")vehicle.motBooked=row.date;
        else if(type.startsWith("Tax Renewed"))vehicle.taxDue=nextDue;
        else if(type==="Tacho Calibration"){vehicle.tachoLast=row.date;vehicle.tachoDue=nextDue;}
        else if(type==="LOLER 6-Month")vehicle.loler6=nextDue;
        else if(type==="LOLER 12-Month")vehicle.loler12=nextDue;
        else if(type==="Fire Extinguisher")vehicle.fireDue=nextDue;
        else if(type==="Onboard Weighing Calibration")vehicle.weighingLast=row.date;
        else if(type==="Autolock Calibration")vehicle.autolockLast=row.date;
        data.activity.unshift({icon:"✓",text:`<strong>${escapeHtml(type)} logged</strong> for ${displayReg(reg)}`,time:"Just now"});
        saveData();closeModal();render();toast(`${type} saved${nextDue?`; next due ${nextDue}`:""}.`);
      }
      if (event.target.closest("[data-save-driver-profile]")) {
        const button=event.target.closest("[data-save-driver-profile]"),oldName=button.dataset.saveDriverProfile;
        const form=document.getElementById("driver-form");if(!form.reportValidity())return;
        const driver=data.drivers.find(item=>item.name===oldName),fd=new FormData(form);
        const name=document.getElementById("driver-name").value.trim(),id=document.getElementById("driver-id").value.trim();
        if(data.drivers.some(item=>item!==driver&&item.name.toLowerCase()===name.toLowerCase())){toast("A driver with that name already exists.");return;}
        driver.name=name;driver.id=id;
        ["licenceExpiry","photoExpiry","cardExpiry","cpcExpiry","declarationDue","eyesightDue","bridgeDue","pg9Due","assessmentDue","dgDue"].forEach(key=>driver[key]=fd.get(key)?formattedDate(fd.get(key)):"");
        driver.active=fd.get("active")==="true";driver.status=driver.active?"Active":"Archived";driver.notifiable=fd.get("notifiable")==="true";driver.condition=fd.get("condition");
        data.courses.forEach(row=>{if(row.driver===oldName)row.driver=name;});
        data.training.forEach(row=>{if(row.driver===oldName)row.driver=name;});
        saveData();closeModal();render();toast("Driver profile saved.");
      }
      if (event.target.closest("[data-save-course]")) {
        const form=document.getElementById("course-form");if(!form.reportValidity())return;
        const date=document.getElementById("course-date").value;
        data.courses.unshift({driver:document.getElementById("course-driver").value,course:document.getElementById("course-name").value.trim(),date:formattedDate(date),hours:Number(document.getElementById("course-hours").value),previous:false,notes:document.getElementById("course-notes").value.trim()});
        saveData();closeModal();render();toast("CPC course saved.");
      }
      if (event.target.closest("[data-save-defect]")) {
        const form=document.getElementById("defect-form");if(!form.reportValidity())return;
        const source=document.getElementById("defect-source").value,pmiDate=document.getElementById("defect-pmi").value;
        if(source==="Found at PMI"&&!pmiDate){toast("Choose a logged PMI date for a defect found at PMI.");return;}
        const n=Math.max(0,...data.defects.map(item=>Number(String(item.id).replace(/\D/g,""))||0))+1;
        data.defects.unshift({id:`D${String(n).padStart(4,"0")}`,reg:document.getElementById("defect-reg").value,driver:document.getElementById("defect-driver").value,date:formattedDate(document.getElementById("defect-date").value),time:document.getElementById("defect-time").value,defect:document.getElementById("defect-description").value.trim(),status:"Outstanding",jobCard:"",action:"",actionBy:"",actionDate:"",provider:"",repair:"",repairBy:"",completed:"",part3Complete:false,source,pmiDate:pmiDate?formattedDate(pmiDate):""});
        saveData();closeModal();render();toast("Driver defect reported.");
      }
      if(event.target.closest("[data-save-starter]")){
        const form=document.getElementById("starter-form");if(!form.reportValidity())return;
        const name=document.getElementById("starter-name").value.trim(),date=document.getElementById("starter-date").value;
        if(data.starters.some(item=>item.name.toLowerCase()===name.toLowerCase())){toast("A starter with that name is already recorded.");return;}
        const id=`NS-${String(Math.max(0,...data.starters.map(item=>Number(item.id.split("-")[1])||0))+1).padStart(3,"0")}`;
        data.starters.unshift({id,name,startDate:formattedDate(date),inductionDone:"",signOff1Done:"",signOff2Done:""});
        if(!data.drivers.some(driver=>driver.name.toLowerCase()===name.toLowerCase()))data.drivers.push({name,id:`TV-${String(130+data.drivers.length).padStart(3,"0")}`,role:"Class 2",status:"Active",active:true,notifiable:false,notes:"New starter – add licence/card/training dates via Edit / Archive Driver",cardExpiry:"",licenceExpiry:"",photoExpiry:"",cpcExpiry:"",lastShift:"No shift recorded"});
        saveData();closeModal();render();toast(`${name} added to new starters.`);
      }
      if(event.target.closest("[data-save-starter-step]")){
        const id=event.target.closest("[data-save-starter-step]").dataset.saveStarterStep,step=Number(event.target.closest("[data-save-starter-step]").dataset.step),form=document.getElementById("starter-signoff");if(!form.reportValidity())return;
        const row=data.starters.find(item=>item.id===id),current=starterStep(row);if(!current||current.step!==step){toast("Complete the previous induction step first.");return;}
        const date=document.getElementById("starter-completion").value,previous=step===1?row.startDate:step===2?row.inductionDone:row.signOff1Done;if(dayDelta(date)<0){toast("The sign-off date cannot be in the future.");return;}if(parseLocalDate(date)<parseLocalDate(previous)){toast("A sign-off cannot be dated before the previous stage was completed.");return;}
        row[current.doneKey]=formattedDate(date);saveData();closeModal();render();toast(`${current.label} recorded for ${row.name}.`);
      }
      if(event.target.closest("[data-save-tacho-link]")){
        const id=event.target.closest("[data-save-tacho-link]").dataset.saveTachoLink,form=document.getElementById("tacho-link-form");if(!form.reportValidity())return;
        const row=data.tacho.find(item=>item.id===id),driver=data.drivers.find(item=>item.id===document.getElementById("tacho-link-driver").value);
        row.driver=driver.name;row.driverId=driver.id;row.flag=String(row.flag||"").replace("Driver card not linked","").trim();
        if(!row.flag&&row.category)row.flag=row.category;
        saveData();closeModal();render();toast(`Duty day linked to ${driver.name}.`);
      }
      if (event.target.closest("[data-save-defect-update]")) {
        const id=event.target.closest("[data-save-defect-update]").dataset.saveDefectUpdate,form=document.getElementById("defect-update");if(!form.reportValidity())return;
        const row=data.defects.find(item=>item.id===id),done=document.getElementById("defect-done").value==="true",completed=document.getElementById("defect-completed").value;
        if(done&&(!completed||!document.getElementById("defect-job").value.trim())){toast("Part 3 requires a completion date and job card number.");return;}
        row.jobCard=document.getElementById("defect-job").value.trim();row.provider=document.getElementById("defect-provider").value.trim();row.action=document.getElementById("defect-action").value.trim();row.actionBy=document.getElementById("defect-action-by").value.trim();row.actionDate=document.getElementById("defect-action-date").value?formattedDate(document.getElementById("defect-action-date").value):"";row.repair=document.getElementById("defect-repair").value.trim();row.repairBy=document.getElementById("defect-repair-by").value.trim();row.part3Complete=done;row.completed=completed?formattedDate(completed):"";row.status=done?"Completed":row.action||row.repair?"In progress":"Outstanding";
        saveData();closeModal();render();toast(done?"Defect marked COMPLETE.":"Defect update saved.");
      }
      if (event.target.closest("[data-save-status]")) {
        const reg=event.target.closest("[data-save-status]").dataset.saveStatus,form=document.getElementById("status-form");if(!form.reportValidity())return;
        const status=document.getElementById("status-type").value,date=formattedDate(document.getElementById("status-start").value),vehicle=data.vehicles.find(item=>item.reg===reg);
        if(status==="Back to Active"){const open=data.statuses.filter(item=>item.reg===reg&&!item.end);if(!open.length){toast("There is nothing to close for this vehicle.");return;}open.forEach(item=>item.end=date);vehicle.status="In service";}
        else{data.statuses.push({reg,status,start:date,end:"",notes:document.getElementById("status-notes").value.trim(),loggedBy:"Stephen"});vehicle.status=status==="VOR (Off Road)"?"VOR":"Workshop";}
        saveData();closeModal();render();toast("Vehicle status history updated.");
      }
      if(event.target.closest("[data-save-vehicle-edit]")){
        const reg=event.target.closest("[data-save-vehicle-edit]").dataset.saveVehicleEdit,form=document.getElementById("vehicle-edit");if(!form.reportValidity())return;
        const vehicle=data.vehicles.find(item=>item.reg===reg),fd=new FormData(form);
        for(const key of ["type","make","model","provider","dtp"])vehicle[key]=String(fd.get(key)||"").trim();
        vehicle.intervalWeeks=Number(fd.get("intervalWeeks"));vehicle.mileage=Number(fd.get("mileage")||0).toLocaleString("en-GB");vehicle.active=fd.get("active")==="true";vehicle.inFleet=fd.get("inFleet")==="true";
        for(const key of ["pmiLast","nextPmi","tachoLast","tachoDue","motDue","taxDue","loler6","loler12","fireDue"])vehicle[key]=fd.get(key)?formattedDate(fd.get(key)):"";
        saveData();closeModal();render();toast(`${displayReg(reg)} vehicle record updated.`);
      }
      if (event.target.closest("[data-save-vehicle]")) {
        const form = document.getElementById("add-form");
        if (!form.reportValidity()) return;
        const reg = normalizeReg(document.getElementById("add-reg").value);
        if (data.vehicles.some(vehicle=>normalizeReg(vehicle.reg)===reg)) { document.getElementById("add-reg").setCustomValidity("This registration is already on the fleet register."); form.reportValidity(); document.getElementById("add-reg").setCustomValidity(""); return; }
        const nextPmi=document.getElementById("add-pmi").value;
        data.vehicles.push({ reg, make:document.getElementById("add-make").value.trim(), model:document.getElementById("add-model").value.trim(), type:document.getElementById("add-type").value, mileage:Number(document.getElementById("add-mileage").value||0).toLocaleString("en-GB"), nextPmi:nextPmi?formattedDate(nextPmi):"", status:"In service", active:true, inFleet:true, intervalWeeks:Number(document.getElementById("add-pmi-interval").value||data.config.pmiDefaultWeeks||10), provider:document.getElementById("add-provider").value, pmiLast:"", tachoDue:"", motDue:"", taxDue:"", loler6:"", loler12:"", fireDue:"", weighingLast:"", autolockLast:"", tachoLast:"", dtp:"" });
        saveData(); closeModal(); render(); toast(`${displayReg(reg)} added to the vehicle register.`);
      }
      if (event.target.closest("[data-save-driver]")) {
        const form = document.getElementById("add-form");
        if (!form.reportValidity()) return;
        const id = document.getElementById("add-id").value.trim().toUpperCase();
        if (data.drivers.some(driver=>driver.id.toUpperCase()===id)) { document.getElementById("add-id").setCustomValidity("This driver ID is already in use."); form.reportValidity(); document.getElementById("add-id").setCustomValidity(""); return; }
        data.drivers.push({ name:document.getElementById("add-name").value.trim(), id, role:document.getElementById("add-role").value, status:"Active", active:true, notifiable:false, cardExpiry:document.getElementById("add-card").value?formattedDate(document.getElementById("add-card").value):"", licenceExpiry:"",photoExpiry:"",cpcExpiry:"", lastShift:"No shift recorded" });
        saveData(); closeModal(); render(); toast("Driver added.");
      }
      const modalAction = event.target.closest("[data-action]")?.dataset.action;
      if (modalAction === "new-issue") openNewIssue();
      if (modalAction === "log-check") openLogCheck(event.target.closest("[data-reg]")?.dataset.reg||"");
      if (modalAction === "set-status") openStatus(event.target.closest("[data-reg]")?.dataset.reg||"");
      if (modalAction === "edit-vehicle") openEditVehicle(event.target.closest("[data-reg]")?.dataset.reg||"");
      if (modalAction === "report-export") toast("Report export is a preview-only action.");
    });
    modalBackdrop.addEventListener("click", event => { if (event.target === modalBackdrop) closeModal(); });
    document.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); document.getElementById("global-search").focus(); }
      if (event.key === "Escape") { closeModal(); document.getElementById("search-results").classList.remove("open"); }
    });
    const search = document.getElementById("global-search");
    const searchResults = document.getElementById("search-results");
    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      if (!q) { searchResults.classList.remove("open"); return; }
      const results = [
        ...data.vehicles.filter(item=>`${item.reg} ${displayReg(item.reg)} ${item.make} ${item.model}`.toLowerCase().includes(q)).map(item=>({title:displayReg(item.reg),sub:`Vehicle · ${item.make} ${item.model}`,view:"vehicles",reg:item.reg})),
        ...data.drivers.filter(item=>`${item.name} ${item.id}`.toLowerCase().includes(q)).map(item=>({title:item.name,sub:`Driver · ${item.id}`,view:"drivers"})),
        ...data.issues.filter(item=>`${item.id} ${item.reg} ${displayReg(item.reg)} ${item.issue} ${item.category}`.toLowerCase().includes(q)).map(item=>({title:item.id,sub:`PMI issue · ${displayReg(item.reg)} · ${item.issue}`,view:"compliance",issue:item.id})),
        ...data.defects.filter(item=>`${item.id} ${item.reg} ${item.defect} ${item.driver}`.toLowerCase().includes(q)).map(item=>({title:item.id,sub:`Driver defect · ${displayReg(item.reg)} · ${item.defect}`,view:"defects",defect:item.id})),
        ...data.checks.filter(item=>`${item.id} ${item.reg} ${item.type}`.toLowerCase().includes(q)).map(item=>({title:item.id,sub:`Completed ${item.type} · ${displayReg(item.reg)}`,view:"checks",check:item.id}))
      ].slice(0,8);
      searchResults.innerHTML = results.length ? results.map((item,index)=>`<button class="search-result" data-result="${index}"><strong>${escapeHtml(item.title)}</strong><span>${escapeHtml(item.sub)}</span></button>`).join("") : `<div class="empty-state">No matching fleet records.</div>`;
      searchResults.classList.add("open");
      searchResults.querySelectorAll("[data-result]").forEach(button=>button.addEventListener("click",()=>{
        const item=results[Number(button.dataset.result)]; searchResults.classList.remove("open"); search.value="";
        if(item.issue){setView("compliance");openIssue(item.issue);}else if(item.defect){setView("defects");openDefectUpdate(item.defect);}else if(item.check){setView("checks");openCheckDocument(item.check);}else if(item.reg){setView("vehicles");openVehicle(item.reg);}else setView(item.view);
      }));
    });
    document.addEventListener("click", event => { if (!event.target.closest(".search-wrap")) searchResults.classList.remove("open"); });
    render();
  </script>
</body>
</html>
